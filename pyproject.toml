[project]
name = "rdmns-train-bot"
version = "0.1.0"
description = "Telegram bot for Sri Lanka Railway timetable search (RDMNS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=6.1.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "telethon>=1.43.2",
]

[project.scripts]
rdmns-bot = "bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["bot.py", "timetable.py"]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
